experiment_id: v3_01_cube_strategy_push
section: V3_01
task_family: controllability_strategy
category: block
robot_model: xhand
hand_side: right
scene:
  table_margin: 0.0
  table_height: 0.0
scene_objects:
- id: red
  source_target:
    category: block
    source_index: 1
    target_index: 1
  role: 4 cm cube manipulated to a shared final planar pose
support_scene_objects:
- id: table
  mesh_path: assets/support/table_080_070_005.obj
  static: true
  support_asset: true
  friction: 1.2
  template_pose:
    object_pos:
    - 0.0
    - 0.0
    - 0.0
    object_quat_wxyz:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
retarget_reuse:
  pipeline_root: outputs/v2_03_pipeline
  experiment_id: v2_03_stack_rgb_blocks_equal_size
controllability:
  factor: cube_transport_strategy
  condition: push
  expected_lift: false
  shared_start_x: -0.04
  shared_target_x: 0.18
trajectory:
  id: cube_strategy_push
  output_motion_path: outputs/v3_01_controllability_pipeline/v3_01_cube_strategy_push/exports/cube_strategy_push.npz
  exported_rl_path: outputs/v3_01_controllability_pipeline/v3_01_cube_strategy_push/exports/cube_strategy_push_oakink_sequence.npy
  phases:
  - name: reach_red_push
    active_object: red
    type: reach_to_keyframe
    target: red_grasp
    frames: 10
    backoff_translation:
    - -0.08
    - 0.0
    - 0.0
  - name: grasp_red
    active_object: red
    type: hold_keyframe
    keyframe: red_grasp
    frames: 4
  - name: push_red
    active_object: red
    type: interpolate_keyframes
    start: red_grasp
    end: red_push_end
    frames: 26
  - name: hold_red_target
    active_object: red
    type: hold_keyframe
    keyframe: red_push_end
    frames: 3
  - name: release_red
    active_object: red
    type: interpolate_keyframes
    start: red_push_end
    end: red_push_released
    frames: 5
    clearance_translation:
    - 0.0
    - 0.0
    - 0.08
  - name: terminal_hold
    active_object: red
    type: hold_keyframe
    keyframe: red_push_released
    frames: 6
keyframes:
- id: red_grasp
  object_id: red
  from_retarget:
    motion_path: auto
    frame: last
  transforms:
  - type: set_pair_pose
    object_pos:
    - -0.04
    - 0.0
    - 0.0
  - type: align_pair_lowest_z
    target_lowest_z: 0.0
- id: red_push_end
  object_id: red
  derive_from: red_grasp
  transforms:
  - type: translate_pair
    delta:
    - 0.22
    - 0.0
    - 0.0
  - type: align_pair_lowest_z
    target_lowest_z: 0.0
- id: red_push_released
  object_id: red
  derive_from: red_push_end
  transforms:
  - type: open_hand
