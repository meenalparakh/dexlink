experiment_id: v3_01_cube_strategy_pick
section: V3_01
task_family: controllability_strategy
category: block
robot_model: xhand
hand_side: right
scene:
  table_margin: 0.0
  table_height: 0.0
scene_objects:
- id: red
  source_target:
    category: block
    source_index: 1
    target_index: 1
  role: 4 cm cube manipulated to a shared final planar pose
support_scene_objects:
- id: table
  mesh_path: assets/support/table_080_070_005.obj
  static: true
  support_asset: true
  friction: 1.2
  template_pose:
    object_pos:
    - 0.0
    - 0.0
    - 0.0
    object_quat_wxyz:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
retarget_reuse:
  pipeline_root: outputs/v2_03_pipeline
  experiment_id: v2_03_stack_rgb_blocks_equal_size
controllability:
  factor: cube_transport_strategy
  condition: pick
  expected_lift: true
  shared_start_x: -0.04
  shared_target_x: 0.18
trajectory:
  id: cube_strategy_pick
  output_motion_path: outputs/v3_01_controllability_pipeline/v3_01_cube_strategy_pick/exports/cube_strategy_pick.npz
  exported_rl_path: outputs/v3_01_controllability_pipeline/v3_01_cube_strategy_pick/exports/cube_strategy_pick_oakink_sequence.npy
  phases:
  - name: reach_red
    active_object: red
    type: reach_to_keyframe
    target: red_grasp
    frames: 10
    backoff_translation:
    - -0.08
    - 0.0
    - 0.0
  - name: grasp_red
    active_object: red
    type: hold_keyframe
    keyframe: red_grasp
    frames: 4
  - name: lift_red
    active_object: red
    type: interpolate_keyframes
    start: red_grasp
    end: red_lifted
    frames: 10
  - name: move_red
    active_object: red
    type: interpolate_keyframes
    start: red_lifted
    end: red_hover
    frames: 10
  - name: place_red
    active_object: red
    type: interpolate_keyframes
    start: red_hover
    end: red_placed
    frames: 6
  - name: hold_red_placed
    active_object: red
    type: hold_keyframe
    keyframe: red_placed
    frames: 3
  - name: release_red
    active_object: red
    type: interpolate_keyframes
    start: red_placed
    end: red_released
    frames: 5
    clearance_translation:
    - 0.0
    - 0.0
    - 0.08
  - name: terminal_hold
    active_object: red
    type: hold_keyframe
    keyframe: red_released
    frames: 6
keyframes:
- id: red_grasp
  object_id: red
  from_retarget:
    motion_path: auto
    frame: last
  transforms:
  - type: set_pair_pose
    object_pos:
    - -0.04
    - 0.0
    - 0.0
  - type: align_pair_lowest_z
    target_lowest_z: 0.0
- id: red_lifted
  object_id: red
  derive_from: red_grasp
  transforms:
  - type: translate_pair
    delta:
    - 0.0
    - 0.0
    - 0.14
- id: red_hover
  object_id: red
  derive_from: red_lifted
  transforms:
  - type: set_pair_pose
    object_pos:
    - 0.18
    - 0.0
    - 0.0
  - type: align_pair_lowest_z
    target_lowest_z: 0.052000000000000005
- id: red_placed
  object_id: red
  derive_from: red_hover
  transforms:
  - type: set_pair_pose
    object_pos:
    - 0.18
    - 0.0
    - 0.0
  - type: align_pair_lowest_z
    target_lowest_z: 0.0
- id: red_released
  object_id: red
  derive_from: red_placed
  transforms:
  - type: open_hand
