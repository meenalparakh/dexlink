keyframes:
- id: object_grasp
  object_id: object
  from_retarget:
    motion_path: auto
    frame: last
  transforms:
  - type: set_pair_pose
    object_pos:
    - 0.0
    - 0.0
    - 0.018
  - type: align_pair_lowest_z
    target_lowest_z: 0.002
- id: object_lifted
  object_id: object
  derive_from: object_grasp
  transforms:
  - type: translate_pair
    delta:
    - 0.0
    - 0.0
    - 0.16
- id: object_hover
  object_id: object
  derive_from: object_lifted
  transforms:
  - type: set_pair_pose
    object_pos:
    - -0.22
    - -0.05
    - 0.0
  - type: align_pair_lowest_z
    target_lowest_z: 0.05
- id: object_placed
  object_id: object
  derive_from: object_hover
  transforms:
  - type: set_pair_pose
    object_pos:
    - -0.22
    - -0.05
    - 0.0
  - type: align_pair_lowest_z
    target_lowest_z: 0.0
- id: object_released
  object_id: object
  derive_from: object_placed
  transforms:
  - type: open_hand
trajectory:
  id: bowl_transfer
  output_motion_path: outputs/v2_15_pipeline/v2_15_take_bar_out_of_bowl/exports/bowl_transfer.npz
  exported_rl_path: outputs/v2_15_pipeline/v2_15_take_bar_out_of_bowl/exports/bowl_transfer_oakink_sequence.npy
  phases:
  - name: reach_object
    active_object: object
    type: reach_to_keyframe
    target: object_grasp
    frames: 10
    backoff_translation:
    - -0.08
    - 0.0
    - 0.0
  - name: grasp_object
    active_object: object
    type: hold_keyframe
    keyframe: object_grasp
    frames: 4
  - name: lift_object
    active_object: object
    type: interpolate_keyframes
    start: object_grasp
    end: object_lifted
    frames: 10
  - name: move_object
    active_object: object
    type: interpolate_keyframes
    start: object_lifted
    end: object_hover
    frames: 10
  - name: place_object
    active_object: object
    type: interpolate_keyframes
    start: object_hover
    end: object_placed
    frames: 6
  - name: hold_object_placed
    active_object: object
    type: hold_keyframe
    keyframe: object_placed
    frames: 3
  - name: release_object
    active_object: object
    type: interpolate_keyframes
    start: object_placed
    end: object_released
    frames: 5
    clearance_translation:
    - 0.0
    - 0.0
    - 0.08
