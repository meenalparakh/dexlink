experiment_id: 05_trajectory_lift_bowl
section: V
task_family: real_world_grasp_lift
category: bowl
robot_model: xhand
hand_side: right
source_target:
  category: bowl
  source_index: 2
  target_index: 6
keyframes:
- id: grasp
  from_retarget:
    motion_path: auto
    frame: last
- id: lifted
  derive_from: grasp
  transforms:
  - type: translate_pair
    delta:
    - 0.0
    - 0.0
    - 0.18
trajectory:
  id: real_world_reach_grasp_lift
  output_motion_path: outputs/trajectory_templates/05_trajectory_lift_bowl/real_world_reach_grasp_lift.npz
  exported_rl_path: outputs/trajectory_templates/05_trajectory_lift_bowl/real_world_reach_grasp_lift_oakink_sequence_exported.npy
  phases:
  - name: reach
    type: reach_to_keyframe
    target: grasp
    frames: 20
    backoff_translation:
    - -0.08
    - 0.0
    - 0.0
  - name: grasp
    type: hold_keyframe
    keyframe: grasp
    frames: 8
  - name: lift
    type: interpolate_keyframes
    start: grasp
    end: lifted
    frames: 24
  - name: hold_lift
    type: hold_keyframe
    keyframe: lifted
    frames: 8
