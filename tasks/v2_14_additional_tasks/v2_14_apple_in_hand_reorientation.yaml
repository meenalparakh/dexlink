experiment_id: v2_14_apple_in_hand_reorientation
section: V2_14
task_family: additional_tasks
category: apple_in_hand_reorientation
robot_model: xhand
hand_side: right
object_static: false
scene:
  table_size:
  - 0.55
  - 0.55
  table_margin: 0.002
  table_height: 0.0
support_scene_objects:
- id: table
  mesh_path: assets/support/table_080_070_005.obj
  static: true
  support_asset: true
  friction: 1.2
  template_pose:
    object_pos:
    - 0.0
    - 0.0
    - 0.0
    object_quat_wxyz:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
scene_objects:
- id: apple
  source_target:
    category: fruit
    source_index: 1
    target_index: 2
  role: apple remains at one fixed world position while its orientation rotates through hand configurations
    solved for rotated apple targets
keyframes:
- id: apple_pick_grasp
  object_id: apple
  source_target:
    category: fruit
    source_index: 1
    target_index: 2
  from_retarget:
    motion_path: auto
    frame: last
  transforms:
  - type: set_pair_pose
    object_pos:
    - 0.18
    - 0.0
    - 0.0
  - type: align_pair_lowest_z
    target_lowest_z: 0.002
  role: 0 degree apple grasp placed on the table for the pick step
- id: apple_reorient_z000
  object_id: apple
  derive_from: apple_pick_grasp
  transforms:
  - type: set_pair_pose
    object_pos:
    - 0.0
    - 0.0
    - 0.14
  - type: set_object_pose
    object_pos:
    - 0.0
    - 0.0
    - 0.14
    object_quat_wxyz:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
  role: initial in-hand apple pose after picking from the table; reuses the 0 degree retargeted grasp
- id: apple_reorient_z060
  object_id: apple
  source_target:
    category: fruit
    source_index: 1
    target_index: 3
  from_retarget:
    motion_path: auto
    frame: last
  transforms:
  - type: set_pair_pose
    object_pos:
    - 0.0
    - 0.0
    - 0.14
  - type: set_object_pose
    object_pos:
    - 0.0
    - 0.0
    - 0.14
    object_quat_wxyz:
    - 0.8660254037844387
    - 0.0
    - 0.0
    - -0.49999999999999994
  role: retargeted hand configuration for the apple rotated 60 degrees about the target z-axis; task placement
    rotates only the apple by the inverse angle
- id: apple_reorient_z120
  object_id: apple
  source_target:
    category: fruit
    source_index: 1
    target_index: 4
  from_retarget:
    motion_path: auto
    frame: last
  transforms:
  - type: set_pair_pose
    object_pos:
    - 0.0
    - 0.0
    - 0.14
  - type: set_object_pose
    object_pos:
    - 0.0
    - 0.0
    - 0.14
    object_quat_wxyz:
    - 0.5000000000000001
    - 0.0
    - 0.0
    - -0.8660254037844386
  role: retargeted hand configuration for the apple rotated 120 degrees about the target z-axis; task
    placement rotates only the apple by the inverse angle
- id: apple_reorient_z180
  object_id: apple
  source_target:
    category: fruit
    source_index: 1
    target_index: 5
  from_retarget:
    motion_path: auto
    frame: last
  transforms:
  - type: set_pair_pose
    object_pos:
    - 0.0
    - 0.0
    - 0.14
  - type: set_object_pose
    object_pos:
    - 0.0
    - 0.0
    - 0.14
    object_quat_wxyz:
    - 6.123233995736766e-17
    - 0.0
    - 0.0
    - -1.0
  role: retargeted hand configuration for the apple rotated 180 degrees about the target z-axis; task
    placement rotates only the apple by the inverse angle
trajectory:
  id: apple_in_hand_reorientation
  output_motion_path: outputs/v2_14_pipeline/v2_14_apple_in_hand_reorientation/exports/apple_in_hand_reorientation.npz
  exported_rl_path: outputs/v2_14_pipeline/v2_14_apple_in_hand_reorientation/exports/apple_in_hand_reorientation_oakink_sequence.npy
  object_switch_transition_frames: 0
  phases:
  - name: reach_apple_on_table
    type: reach_to_keyframe
    active_object: apple
    target: apple_pick_grasp
    frames: 10
    backoff_translation:
    - -0.08
    - 0.0
    - 0.0
  - name: grasp_apple_on_table
    type: hold_keyframe
    active_object: apple
    keyframe: apple_pick_grasp
    frames: 4
  - name: lift_apple_to_reorientation_pose
    type: interpolate_keyframes
    active_object: apple
    start: apple_pick_grasp
    end: apple_reorient_z000
    frames: 12
  - name: hold_initial_reorientation_grasp
    type: hold_keyframe
    active_object: apple
    keyframe: apple_reorient_z000
    frames: 6
  - name: apple_reorient_z000_to_apple_reorient_z060
    type: interpolate_keyframes
    active_object: apple
    start: apple_reorient_z000
    end: apple_reorient_z060
    frames: 16
  - name: apple_reorient_z060_to_apple_reorient_z120
    type: interpolate_keyframes
    active_object: apple
    start: apple_reorient_z060
    end: apple_reorient_z120
    frames: 16
  - name: apple_reorient_z120_to_apple_reorient_z180
    type: interpolate_keyframes
    active_object: apple
    start: apple_reorient_z120
    end: apple_reorient_z180
    frames: 16
  - name: hold_final_reorientation_grasp
    type: hold_keyframe
    active_object: apple
    keyframe: apple_reorient_z180
    frames: 8
note: The four keyframes use separate fruit target variants with 0, 60, 120, and 180 degree z-axis target
  transforms. The sequence starts by picking the 0 degree apple grasp from the table. Reorientation keyframes
  translate the retargeted hand-object pair to the same world position, then use set_object_pose to rotate
  only the apple by the inverse z angle. This keeps the wrist/root placement roughly stable while preserving
  angle-specific finger and minor wrist adjustments from retargeting.
