experiment_id: v2_03_trigger_sprayer_manipulate
section: V2_03
task_family: trigger_sprayer_manipulation
category: trigger_sprayer
robot_model: xhand
hand_side: right
scene:
  table_margin: 0.002
  table_height: 0.0
keyframes:
- id: neck_grasp
  source_target:
    category: trigger_sprayer
    source_index: 3
    target_index: 5
  from_retarget:
    motion_path: auto
    frame: last
  transforms:
  - type: align_pair_lowest_z
    target_lowest_z: 0.002
- id: sprayer_lifted
  derive_from: neck_grasp
  transforms:
  - type: translate_pair
    delta:
    - 0.0
    - 0.0
    - 0.12
- id: spraying_configuration
  source_target:
    category: trigger_sprayer
    source_index: 2
    target_index: 5
  from_retarget:
    motion_path: auto
    frame: last
  transforms:
  - type: align_pair_lowest_z
    target_lowest_z: 0.002
  - type: translate_pair
    delta:
    - 0.0
    - 0.0
    - 0.12
trajectory:
  id: trigger_sprayer_grasp_transition
  output_motion_path: outputs/v2_03_pipeline/v2_03_trigger_sprayer_manipulate/exports/trigger_sprayer_grasp_transition.npz
  exported_rl_path: outputs/v2_03_pipeline/v2_03_trigger_sprayer_manipulate/exports/trigger_sprayer_grasp_transition_oakink_sequence.npy
  phases:
  - name: reach
    type: reach_to_keyframe
    target: neck_grasp
    frames: 10
    backoff_translation:
    - -0.08
    - 0.0
    - 0.0
  - name: neck_grasp
    type: hold_keyframe
    keyframe: neck_grasp
    frames: 4
  - name: lift_sprayer
    type: interpolate_keyframes
    start: neck_grasp
    end: sprayer_lifted
    frames: 12
  - name: transition_to_trigger
    type: interpolate_keyframes
    start: sprayer_lifted
    end: spraying_configuration
    frames: 22
  - name: hold_spraying_configuration
    type: hold_keyframe
    keyframe: spraying_configuration
    frames: 6
support_scene_objects:
- id: table
  mesh_path: assets/support/table_080_120_005.obj
  static: true
  support_asset: true
  friction: 1.2
  template_pose:
    object_pos:
    - 0.0
    - 0.0
    - -0.025
    object_quat_wxyz:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
