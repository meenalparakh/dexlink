experiment_id: v2_03_lift_bucket_s02_t01
section: V2_03
task_family: articulate_then_lift
category: bucket
robot_model: xhand
hand_side: right
scene:
  table_margin: 0.002
  table_height: 0.0
source_target:
  category: bucket
  source_index: 2
  target_index: 1
keyframes:
- id: handle_grasp
  from_retarget:
    motion_path: auto
    frame: last
  transforms:
  - type: rotate_pair
    axis:
    - 1.0
    - 0.0
    - 0.0
    degrees: -90.0
    pivot: object_origin
  - type: set_pair_pose
    object_pos:
    - 0.0
    - 0.0
    - 0.0
  - type: align_pair_lowest_z
    target_lowest_z: 0.002
- id: handle_centered
  derive_from: handle_grasp
  transforms:
  - type: set_articulation
    values:
    - 1.7184511815
    articulation_link_name: link_0
- id: bucket_lifted
  derive_from: handle_centered
  transforms:
  - type: translate_pair
    delta:
    - 0.0
    - 0.0
    - 0.2
trajectory:
  id: bucket_reach_grasp_center_handle_lift
  output_motion_path: outputs/v2_03_pipeline/v2_03_lift_bucket_s02_t01/exports/bucket_reach_grasp_center_handle_lift.npz
  exported_rl_path: outputs/v2_03_pipeline/v2_03_lift_bucket_s02_t01/exports/bucket_reach_grasp_center_handle_lift_oakink_sequence.npy
  phases:
  - name: reach
    type: reach_to_keyframe
    target: handle_grasp
    frames: 10
    backoff_translation:
    - -0.08
    - 0.0
    - 0.0
  - name: grasp_handle
    type: hold_keyframe
    keyframe: handle_grasp
    frames: 4
  - name: center_handle
    type: interpolate_keyframes
    start: handle_grasp
    end: handle_centered
    frames: 25
    articulation_link_name: link_0
  - name: hold_centered_handle
    type: hold_keyframe
    keyframe: handle_centered
    frames: 5
  - name: lift_bucket
    type: interpolate_keyframes
    start: handle_centered
    end: bucket_lifted
    frames: 20
  - name: hold_lifted_bucket
    type: hold_keyframe
    keyframe: bucket_lifted
    frames: 5
support_scene_objects:
- id: table
  mesh_path: assets/support/table_080_120_005.obj
  static: true
  support_asset: true
  friction: 1.2
  template_pose:
    object_pos:
    - 0.0
    - 0.0
    - -0.025
    object_quat_wxyz:
    - 1.0
    - 0.0
    - 0.0
    - 0.0
